<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AutorizaIA Família</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07131c;color:#eaf2f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading b{font-size:22px}.loading p{color:#8fa3b7}
  </style>
</head>
<body>
  <div class="loading"><div><b>AutorizaIA Família</b><p>Carregando formulário...</p></div></div>

  <script>
  (async () => {
    try {
      const response = await fetch("./AutorizaIA/frontend/familia.html", { cache: "no-store" });
      if (!response.ok) throw new Error("Não foi possível carregar o formulário.");
      let html = await response.text();
      html = html.replaceAll("SEU_SUBDOMINIO", "richardxssj");

      const mobileFix = String.raw`<style id="autorizaia-family-mobile-fix">
html,body{max-width:100%;}
img,svg,canvas{max-width:100%;}
@media(max-width:700px){
  html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;}
  *,*::before,*::after{box-sizing:border-box;min-width:0;}
  .app,.page,.hero,.content-grid,.hero-card,.status-card,.form-card,.info-card{
    width:100%!important;max-width:100%!important;min-width:0!important;
  }
  .page{width:calc(100% - 20px)!important;padding:22px 0 44px!important;}
  .hero,.content-grid,.form-grid,.date-time{
    grid-template-columns:minmax(0,1fr)!important;
  }
  .hero{gap:14px!important;margin-bottom:14px!important;}
  .hero-card,.status-card,.form-card,.info-card{padding:20px!important;border-radius:17px!important;}
  .hero-card{min-height:0!important;}
  .hero h1{font-size:clamp(30px,10vw,42px)!important;overflow-wrap:anywhere;}
  .hero p,.status-empty,.field-hint{overflow-wrap:anywhere;}
  .topbar{
    width:100%!important;height:auto!important;min-height:70px!important;
    padding:12px 14px!important;flex-wrap:wrap!important;align-items:center!important;
  }
  .topbar-right{max-width:100%!important;flex-wrap:wrap!important;}
  .security-pill,.family-pill{max-width:100%!important;}
  .section-head{flex-wrap:wrap!important;}
  input,select,textarea,button{max-width:100%!important;}
  .upload-box{width:100%!important;max-width:100%!important;min-height:130px!important;padding:18px!important;}
  .file-preview{max-width:100%!important;}
  .form-actions,.success-actions{flex-direction:column!important;width:100%!important;}
  .form-actions .btn,.success-actions .btn{width:100%!important;}
  .success-overlay{padding:10px!important;overflow-y:auto!important;align-items:flex-start!important;}
  .success-card{width:calc(100vw - 20px)!important;max-width:calc(100vw - 20px)!important;margin:10px auto 24px!important;max-height:none!important;}
}
@media(max-width:430px){
  .page{width:calc(100% - 16px)!important;}
  .hero-card,.status-card,.form-card,.info-card{padding:16px!important;}
  .brand-copy span{font-size:9px!important;}
  .security-pill{display:none!important;}
}
</style>`;

      html = html.replace(/<\/head>/i, mobileFix + "</head>");
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.body.innerHTML = '<div class="loading"><div><b>AutorizaIA Família</b><p>Não foi possível carregar a demonstração.</p></div></div>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
